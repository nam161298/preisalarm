name: Preise pruefen

# Seit 2026-11-14 nur noch von Hand: Die Preissuche laeuft taeglich am PC (SUCHE.md, update.ps1)
# und laedt die Ergebnisse hoch. Die alte Cloud-Pruefung wird von Amazon gesperrt.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preise-pruefen

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preise pruefen
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./check.ps1
      - name: Ergebnis speichern
        run: |
          git config user.name "preisalarm"
          git config user.email "preisalarm@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Preise aktualisiert"
          git pull --rebase
          git push
